<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="origin">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Type a web address and open it in a new tab.">
    <title>Site opener</title>
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <noscript>
        <meta http-equiv="refresh" content="0; url=turn-on-javascript/index.html">
    </noscript>
    <style>
        :root {
            --bg: #EEF1F6;
            --bg-glow: rgba(31, 79, 216, 0.10);
            --surface: #FFFFFF;
            --ink: #141B2D;
            --ink-muted: #5E687C;
            --line: #D3D9E3;
            --accent: #1F4FD8;
            --accent-ink: #FFFFFF;
            --accent-hover: #1841B5;
            --danger: #B42318;
            --shadow: 0 1px 2px rgba(20, 27, 45, 0.06), 0 12px 32px -12px rgba(20, 27, 45, 0.18);
            --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
            --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F1420;
                --bg-glow: rgba(96, 137, 255, 0.14);
                --surface: #171E2E;
                --ink: #EDF0F6;
                --ink-muted: #98A2B8;
                --line: #2A3448;
                --accent: #6089FF;
                --accent-ink: #0B1224;
                --accent-hover: #7A9CFF;
                --danger: #FF7B72;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px -12px rgba(0, 0, 0, 0.6);
            }
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: var(--body);
            font-size: 16px;
            line-height: 1.5;
            color: var(--ink);
            background-color: var(--bg);
            background-image: radial-gradient(60rem 30rem at 50% 42%, var(--bg-glow), transparent 70%);
            background-repeat: no-repeat;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1.25rem 1.5rem;
            font-family: var(--display);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.01em;
        }

        header img {
            width: 22px;
            height: 22px;
            border-radius: 5px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem 4rem;
        }

        .opener {
            width: 100%;
            max-width: 42rem;
        }

        h1 {
            font-family: var(--display);
            font-weight: 600;
            font-size: clamp(2rem, 6vw, 3.25rem);
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin: 0 0 0.75rem;
            text-wrap: balance;
        }

        .lede {
            margin: 0 0 2rem;
            color: var(--ink-muted);
            font-size: 1.0625rem;
            max-width: 32rem;
        }

        form {
            display: flex;
            align-items: stretch;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            box-shadow: var(--shadow);
            padding: 0.375rem 0.375rem 0.375rem 1.25rem;
            transition: border-color 120ms ease, box-shadow 120ms ease;
        }

        form:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
        }

        form.is-invalid {
            border-color: var(--danger);
        }

        form.is-invalid:focus-within {
            box-shadow: var(--shadow), 0 0 0 4px color-mix(in srgb, var(--danger) 22%, transparent);
        }

        .field {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 0;
        }

        .field svg {
            flex: none;
            width: 20px;
            height: 20px;
            color: var(--ink-muted);
        }

        input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            font: inherit;
            font-size: 1.125rem;
            color: var(--ink);
            padding: 0.625rem 0;
        }

        input::placeholder {
            color: var(--ink-muted);
            opacity: 0.8;
        }

        button {
            flex: none;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            font: inherit;
            font-weight: 500;
            font-size: 1rem;
            padding: 0 1.5rem;
            cursor: pointer;
            transition: background-color 120ms ease;
        }

        button:hover { background: var(--accent-hover); }

        button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .hint {
            margin: 1rem 0 0 1.25rem;
            font-size: 0.9375rem;
            color: var(--ink-muted);
            min-height: 1.5em;
        }

        .hint[data-state="error"] { color: var(--danger); }

        kbd {
            font: inherit;
            font-size: 0.8125rem;
            padding: 0.05em 0.45em;
            border: 1px solid var(--line);
            border-bottom-width: 2px;
            border-radius: 5px;
            background: var(--surface);
        }

        footer {
            padding: 1.25rem 1.5rem;
            font-size: 0.875rem;
            color: var(--ink-muted);
            text-align: center;
        }

        @media (max-width: 480px) {
            form {
                border-radius: 1.5rem;
                flex-direction: column;
                gap: 0.375rem;
                padding: 0.5rem 0.5rem 0.5rem 1rem;
            }
            button { padding: 0.75rem 1.5rem; }
            .hint { margin-left: 0.25rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <header>
        <img src="cloudflare-icon.png" alt="">
        <span>Site opener</span>
    </header>

    <main>
        <section class="opener">
            <h1>Open any website in a new tab.</h1>
            <p class="lede">Type a web address below. The site opens in a new tab, and this page stays where it is.</p>

            <form id="openForm" novalidate>
                <label class="field">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path>
                    </svg>
                    <input id="urlInput" type="text" inputmode="url" autocomplete="url" spellcheck="false" autocapitalize="off" autofocus placeholder="example.com" aria-label="Web address" aria-describedby="hint">
                </label>
                <button type="submit">Open</button>
            </form>

            <p class="hint" id="hint" aria-live="polite">Press <kbd>Enter</kbd> to open. You can leave out https://.</p>
        </section>
    </main>

    <footer>Links open in a new tab and are never stored.</footer>

    <script src="script.js"></script>
</body>
</html>
